name: Release

on:
  workflow_dispatch:
#defaults:
#  run:
#    working-directory: src
jobs:
  release-keenrouterwg:
    #needs: build
    runs-on: ubuntu-latest
    steps:
      - name: version
        run: echo "version=$(jq -r .version < ./src/package.json)" >> $GITHUB_OUTPUT
        #working-directory: ./src
        id: version
      - name: release
        uses: ncipollo/release-action@v1
        id: create_release
        with:
          draft: false
          prerelease: false
          name: ${{ steps.version.outputs.version }}
          #tag_name: ${{github.ref_name}}
          #body_path: CHANGELOG.md
          artifacts: "src/package.json"
          body: |
            Changes in this Release
            - First Change
            - Second Change
        #env:
        #  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
